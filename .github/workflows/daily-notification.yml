name: Daily Push Notification

on:
  schedule:
    # 6:43PM AEST (UTC+10) = 08:43 UTC
    # 6:43PM AEDT (UTC+11) = 07:43 UTC (Oct-Apr)
    # Run both so it fires close to 6:43PM year-round
    - cron: '43 8 * * *'   # AEST (winter)
    - cron: '43 7 * * *'   # AEDT (summer)
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefix daily-brief

      - name: Send push notifications
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON:     ${{ secrets.SUPABASE_ANON }}
          SUPABASE_EMAIL:    ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node daily-brief/daily-notification.js
