<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contact Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <div class="auth-logo">
        <div class="auth-logo-mark">CT</div>
        <h1 class="auth-title">Contact Tracker</h1>
        <p class="auth-sub">Your personal relationship log</p>
      </div>
      <div class="auth-form">
        <div class="field-group">
          <label class="field-label" for="auth-email">Email</label>
          <input class="field-input" id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field-group">
          <label class="field-label" for="auth-password">Password</label>
          <input class="field-input" id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
        <button id="auth-btn" class="btn-primary" onclick="handleLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="screen">

    <!-- HEADER -->
    <header class="app-header">
      <span class="header-logo-mark">CT</span>
      <h1 class="header-title">Contact Tracker</h1>
      <button class="header-sign-out" onclick="handleSignOut()" title="Sign out">↩</button>
    </header>

    <!-- ENCOUNTER TYPE -->
    <section class="section">
      <div class="section-label">Encounter type</div>
      <div class="type-switcher" id="type-switcher">
        <button class="type-btn active" data-type="call" onclick="selectType(this)">Call</button>
        <button class="type-btn" data-type="1-on-1" onclick="selectType(this)">1-on-1</button>
        <button class="type-btn" data-type="small-group" onclick="selectType(this)">Small group</button>
        <button class="type-btn" data-type="large-group" onclick="selectType(this)">Large group</button>
        <button class="type-btn" data-type="message" onclick="selectType(this)">Message</button>
        <button class="type-btn" data-type="birthday-acknowledgment" onclick="selectType(this)">Birthday 🎂</button>
      </div>
    </section>

    <!-- SEARCH -->
    <section class="section">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input
          class="search-input"
          id="search-input"
          type="search"
          placeholder="Search people…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          oninput="handleSearch(this.value)"
          onkeydown="handleSearchKey(event)"
        />
      </div>
      <div id="search-results" class="search-results hidden"></div>
    </section>

    <!-- SELECTED PEOPLE -->
    <section class="section" id="selected-section" style="display:none">
      <div class="section-label">Selected</div>
      <div class="chips-wrap" id="chips-wrap"></div>
    </section>

    <!-- NOTES -->
    <section class="section">
      <div class="section-label">Notes <span class="section-label-hint">(optional)</span></div>
      <textarea
        class="notes-input"
        id="notes-input"
        placeholder="Where did you meet? What did you talk about?"
        rows="3"
      ></textarea>
    </section>

    <!-- DATE -->
    <section class="section">
      <div class="section-label">Date</div>
      <input class="field-input" id="date-input" type="date" />
    </section>

    <!-- SAVE BUTTON -->
    <section class="section">
      <button class="btn-primary btn-save" id="save-btn" onclick="saveEncounter()">
        <span id="save-btn-text">Save Encounter</span>
      </button>
      <div id="save-status" class="save-status hidden"></div>
    </section>

    <!-- SPACER -->
    <div style="height: 2rem"></div>

  </div>

  <!-- CONFIG & SCRIPTS -->
  <script src="config.js"></script>
  <script src="javascript/app.js"></script>

</body>
</html>
